name: Build SnappyMail - Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package release
        run: |
          tar -czf snappymail-nextcloud.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dev' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snappymail-nextcloud
          path: snappymail-nextcloud.tar.gz
          retention-days: 30
